<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Le Château | Michelin Gastronomy</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&display=swap');
        
        :root {
            --bg: #030303;
            --text: #E5E5E5;
            --gold: #C5A059;
        }

        body {
            margin: 0; padding: 0;
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Cormorant Garamond', serif;
            overflow-x: hidden;
        }

        ::-webkit-scrollbar { display: none; }
        
        h1, h2, h3 { font-family: 'Cinzel', serif; font-weight: 400; text-transform: uppercase; color: var(--gold); }
        h1 { font-size: 8rem; margin: 0; line-height: 1; letter-spacing: 1rem; }

        /* Loader */
        .loader { position: fixed; top: 0; left: 0; width: 100%; height: 100vh; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 9999; }
        .loader-door { position: absolute; top: 0; width: 50%; height: 100vh; background: #0A0A0A; z-index: -1; transition: transform 2s cubic-bezier(0.77, 0, 0.175, 1); }
        .door-left { left: 0; transform-origin: left; }
        .door-right { right: 0; transform-origin: right; }

        /* Nav */
        nav { padding: 3rem 5%; display: flex; justify-content: space-between; position: fixed; width: 90%; z-index: 100; font-family: 'Cinzel'; mix-blend-mode: difference; }

        /* Hero */
        .hero { height: 100vh; display: flex; align-items: center; justify-content: center; position: relative; }
        .hero-img { position: absolute; width: 40vw; height: 60vh; object-fit: cover; opacity: 0; transform: scale(1.1); transition: opacity 0.5s; pointer-events: none; border-radius: 1000px; }
        .hero-title { z-index: 10; text-align: center; }
        .hero-subtitle { font-size: 2rem; font-style: italic; margin-top: 1rem; color: #888; }

        /* Cinematic Mask Section */
        .mask-section { height: 200vh; position: relative; }
        .mask-sticky { display: flex; align-items: center; justify-content: center; height: 100vh; position: sticky; top: 0; overflow: hidden; }
        .mask-text { font-size: 5rem; text-align: center; z-index: 2; position: absolute; mix-blend-mode: difference; color: white; }
        .mask-video-container { width: 30vw; height: 30vw; border-radius: 50%; overflow: hidden; position: relative; }
        .mask-img { width: 100vw; height: 100vh; object-fit: cover; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); }

        /* Horizontal Menu Gallery */
        .gallery-wrap { padding: 0; background: #0A0A0A; height: 100vh; box-sizing: border-box; display: flex; flex-direction: column; justify-content: center; overflow: hidden; }
        .gallery-header { font-size: 3.5rem; text-align: center; margin-bottom: 3rem; margin-top: 0; }
        .gallery { display: flex; width: max-content; padding: 0 5vw; gap: 5vw; }
        .gallery-item { width: 35vw; height: 55vh; position: relative; overflow: hidden; border-radius: 8px; }
        .gallery-item img { width: 100%; height: 100%; object-fit: cover; transition: transform 1s; }
        .gallery-item:hover img { transform: scale(1.05); }
        .gallery-info { position: absolute; bottom: 0; left: 0; width: 100%; padding: 3rem; background: linear-gradient(transparent, rgba(0,0,0,0.9)); box-sizing: border-box; }
        .gallery-info h3 { font-size: 2rem; margin: 0 0 1rem 0; color: white; }
        .gallery-info p { font-size: 1.2rem; color: var(--gold); font-family: 'Cinzel'; margin: 0; }

        /* Footer */
        .footer { height: 100vh; display: flex; align-items: center; justify-content: center; flex-direction: column; text-align: center; background: url('https://images.unsplash.com/photo-1514362545857-3bc16c4c7d1b?q=80&w=2000&auto=format&fit=crop') center/cover; position: relative; }
        .footer::after { content: ''; position: absolute; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.7); z-index: 0; }
        .footer > * { z-index: 1; }
        .btn-gold { padding: 1.5rem 4rem; border: 1px solid var(--gold); color: var(--gold); text-decoration: none; font-family: 'Cinzel'; font-size: 1.2rem; margin-top: 3rem; transition: background 0.3s, color 0.3s; }
        .btn-gold:hover { background: var(--gold); color: black; }

    </style>
</head>
<body>
    <div class="loader">
        <h1 class="loader-text">LE CHÂTEAU</h1>
        <div class="loader-door door-left"></div>
        <div class="loader-door door-right"></div>
    </div>

    <nav>
        <div>RSVP</div>
        <div>MUMBAI</div>
    </nav>

    <div class="hero" id="hero-area">
        <img src="https://images.unsplash.com/photo-1544025162-d76694265947?q=80&w=1000&auto=format&fit=crop" class="hero-img" alt="Food">
        <div class="hero-title">
            <h1 class="gs-title">Le Château</h1>
            <div class="hero-subtitle gs-title">Cuisine of the Gods</div>
        </div>
    </div>

    <div class="mask-section">
        <div class="mask-sticky">
            <div class="mask-text">PERFECTION IN<br>EVERY BITE</div>
            <div class="mask-video-container">
                <img src="https://images.unsplash.com/photo-1550966871-3ed3cdb5ed0c?q=80&w=2000&auto=format&fit=crop" class="mask-img" alt="Interior">
            </div>
        </div>
    </div>

    <div class="gallery-wrap">
        <h2 class="gallery-header">The Masterpieces</h2>
        <div class="gallery">
            <div class="gallery-item">
                <img src="https://images.unsplash.com/photo-1467003909585-2f8a72700288?q=80&w=800&auto=format&fit=crop" alt="Salmon">
                <div class="gallery-info">
                    <h3>Salmon en Croûte</h3>
                    <p>₹2,800</p>
                </div>
            </div>
            <div class="gallery-item">
                <img src="https://images.unsplash.com/photo-1600891964092-4316c288032e?q=80&w=800&auto=format&fit=crop" alt="Steak">
                <div class="gallery-info">
                    <h3>Filet Mignon Blanc</h3>
                    <p>₹4,500</p>
                </div>
            </div>
            <div class="gallery-item">
                <img src="https://images.unsplash.com/photo-1551024601-bec78aea704b?q=80&w=800&auto=format&fit=crop" alt="Dessert">
                <div class="gallery-info">
                    <h3>Macaron Ispahan Gold</h3>
                    <p>₹1,800</p>
                </div>
            </div>
            <div class="gallery-item">
                <img src="https://images.unsplash.com/photo-1519708227418-c8fd9a32b7a2?q=80&w=800&auto=format&fit=crop" alt="Caviar">
                <div class="gallery-info">
                    <h3>Beluga Caviar & Blinis</h3>
                    <p>₹15,000</p>
                </div>
            </div>
            <div class="gallery-item">
                <img src="https://images.unsplash.com/photo-1626844131082-256783844137?q=80&w=800&auto=format&fit=crop" alt="Truffle">
                <div class="gallery-info">
                    <h3>Black Truffle Risotto</h3>
                    <p>₹3,200</p>
                </div>
            </div>
        </div>
    </div>

    <div class="footer">
        <h2>Reserve A Table</h2>
        <a href="#" class="btn-gold">Book Now</a>
    </div>

    <script src="https://unpkg.com/@studio-freight/lenis@1.0.39/dist/lenis.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.4/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.4/ScrollTrigger.min.js"></script>
    <script>
        // Lenis
        const lenis = new Lenis({ duration: 1.5 });
        function raf(time) { lenis.raf(time); requestAnimationFrame(raf); }
        requestAnimationFrame(raf);

        gsap.registerPlugin(ScrollTrigger);

        // Loader
        const loaderAnim = gsap.timeline();
        loaderAnim.to('.loader-text', { opacity: 0, delay: 1, duration: 1 })
                  .to('.door-left', { scaleX: 0, duration: 1.5, ease: 'expo.inOut' }, '<')
                  .to('.door-right', { scaleX: 0, duration: 1.5, ease: 'expo.inOut' }, '<')
                  .set('.loader', { display: 'none' })
                  .from('.gs-title', { y: 100, opacity: 0, duration: 2, ease: 'expo.out', stagger: 0.2 }, '-=0.5');

        // Hero Image follow mouse
        const heroArea = document.getElementById('hero-area');
        const heroImg = document.querySelector('.hero-img');
        heroArea.addEventListener('mousemove', (e) => {
            gsap.to(heroImg, { x: e.clientX - window.innerWidth/2, y: e.clientY - window.innerHeight/2, duration: 1, ease: 'power2.out' });
            heroImg.style.opacity = '0.4';
        });
        heroArea.addEventListener('mouseleave', () => { heroImg.style.opacity = '0'; });

        // Circle Mask Animation
        gsap.to('.mask-video-container', {
            width: '100vw', height: '100vh', borderRadius: 0, ease: 'none',
            scrollTrigger: { trigger: '.mask-section', start: 'top top', end: 'bottom bottom', scrub: true }
        });

        // Horizontal Gallery Smooth Scroll
        gsap.to('.gallery', {
            x: () => -(document.querySelector('.gallery').scrollWidth - window.innerWidth),
            ease: 'none',
            scrollTrigger: { trigger: '.gallery-wrap', start: 'top top', end: '+=2000', pin: true, scrub: 1 }
        });

        // Auto-scroll logic for presentation mode in portfolio
        let autoScrollInterval;
        document.body.addEventListener('mousemove', (e) => {
            const yPos = e.clientY / window.innerHeight;
            clearInterval(autoScrollInterval);
            if (yPos > 0.7) autoScrollInterval = setInterval(() => window.scrollBy({top: window.innerHeight * 0.015}), 16);
            else if (yPos < 0.3) autoScrollInterval = setInterval(() => window.scrollBy({top: -window.innerHeight * 0.015}), 16);
        });
        document.body.addEventListener('mouseleave', () => clearInterval(autoScrollInterval));
    </script>
</body>
</html>
